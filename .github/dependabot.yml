# Dependabot

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
          prefix: "chore(deps)"
        ignore: []
    ignore:
      - dependency-type: "dev"
        update-type: "version-update:semver-patch"
        dependency-name: "eslint"
      - dependency-type: "dev"
        update-type: "version-update:semver-patch"
        dependency-name: "prettier"