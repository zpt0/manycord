<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5865F2"/>
      <stop offset="100%" style="stop-color:#4752C4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded background -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)" filter="url(#shadow)"/>
  
  <!-- Multiple account silhouettes -->
  <g fill="#FFFFFF" opacity="0.95">
    <!-- Back account (left) -->
    <circle cx="160" cy="280" r="70" fill="#FFFFFF" opacity="0.25"/>
    <ellipse cx="160" cy="410" rx="85" ry="55" fill="#FFFFFF" opacity="0.25"/>
    
    <!-- Back account (right) -->
    <circle cx="352" cy="270" r="65" fill="#FFFFFF" opacity="0.25"/>
    <ellipse cx="352" cy="400" rx="80" ry="50" fill="#FFFFFF" opacity="0.25"/>
    
    <!-- Middle account (center-back) -->
    <circle cx="256" cy="250" r="75" fill="#FFFFFF" opacity="0.4"/>
    <ellipse cx="256" cy="385" rx="90" ry="60" fill="#FFFFFF" opacity="0.4"/>
    
    <!-- Front account (main) -->
    <circle cx="256" cy="220" r="85" fill="#FFFFFF"/>
    <ellipse cx="256" cy="360" rx="100" ry="65" fill="#FFFFFF"/>
    
    <!-- Plus indicator -->
    <circle cx="400" cy="140" r="36" fill="#3BA55C"/>
    <rect x="388" y="128" width="24" height="4" rx="2" fill="#FFFFFF"/>
    <rect x="398" y="118" width="4" height="24" rx="2" fill="#FFFFFF"/>
  </g>
  
  <!-- Subtle highlight on front account -->
  <ellipse cx="256" cy="180" rx="40" ry="15" fill="#FFFFFF" opacity="0.3"/>
</svg>